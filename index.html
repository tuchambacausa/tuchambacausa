<title>Tu Chamba Causa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: red social de 3 columnas (perfil · muro · chambas), barra superior fija; en celular una columna con barra inferior */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --line:#D9E1DC;
  --fg:#17221D; --muted:#5B6B63;
  --brand:#0E7A5C; --brand-ink:#FFFFFF; --brand-soft:#DDF0E8;
  --aji:#F2B124; --aji-soft:#FDF0D2; --aji-ink:#5A3D00;
  --ok:#1C8A4A;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211C; --surface-2:#1D2924; --line:#2A3832;
  --fg:#E6EEE9; --muted:#9AAAA2;
  --brand:#35B98E; --brand-ink:#04140E; --brand-soft:#173A2E;
  --aji:#F5BF45; --aji-soft:#3A2E12; --aji-ink:#F8D98C; --ok:#4CC27E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --surface-2:#1D2924; --line:#2A3832;
  --fg:#E6EEE9; --muted:#9AAAA2;
  --brand:#35B98E; --brand-ink:#04140E; --brand-soft:#173A2E;
  --aji:#F5BF45; --aji-soft:#3A2E12; --aji-ink:#F8D98C; --ok:#4CC27E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--brand);text-decoration:none;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.logo-mark svg{display:block}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px 0 38px}
.search svg{position:absolute;left:13px;top:11px;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{color:var(--brand)}
.nav a[aria-current="page"] span{box-shadow:0 2px 0 var(--brand)}

/* grilla principal */
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:16px;margin-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.demo{display:inline-block;font-size:11px;font-weight:700;color:var(--aji-ink);background:var(--aji-soft);border-radius:6px;padding:2px 8px}

/* avatar */
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-family:var(--font-display)}
.av.s40{width:40px;height:40px;font-size:15px}.av.s48{width:48px;height:48px;font-size:17px}.av.s72{width:72px;height:72px;font-size:26px}.av.s96{width:96px;height:96px;font-size:34px}

/* tarjeta de mi perfil */
.me{padding:0;overflow:hidden}
.me .cover{height:58px;background:linear-gradient(120deg,var(--brand),color-mix(in oklab,var(--brand) 55%,var(--aji)))}
.me .body{padding:0 16px 16px;margin-top:-30px;display:flex;flex-direction:column;gap:6px}
.me .av{border:3px solid var(--surface)}
.me .name{font-weight:700;font-size:16px}
.me .title{color:var(--muted);font-size:13px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.stat b{color:var(--brand);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--brand-soft);color:var(--brand);width:fit-content}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.linklist{display:flex;flex-direction:column;gap:2px}
.linklist a{color:var(--fg);text-decoration:none;font-size:14px;padding:6px 8px;border-radius:8px;display:flex;justify-content:space-between}
.linklist a:hover{background:var(--surface-2)}
.linklist small{color:var(--muted)}

/* publicar */
.composer{display:flex;flex-direction:column;gap:12px}
.composer .row{display:flex;gap:12px;align-items:flex-start}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:46px;border:1px solid var(--line);border-radius:22px;background:var(--surface-2);padding:11px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.btn{border:0;border-radius:999px;padding:8px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.aji{background:var(--aji);color:#2B1D00}
.btn:hover{filter:brightness(1.06)}
.composer .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* publicaciones */
.post{display:flex;flex-direction:column;gap:12px}
.post .head{display:flex;gap:12px;align-items:center}
.post .who{min-width:0}
.post .who b{display:block;font-size:15px}
.post .who span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post p{margin:0;white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.tag.logro{background:var(--aji-soft);color:var(--aji-ink)}
.tag.chamba{background:var(--brand-soft);color:var(--brand)}
.react{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.react button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.react button:hover{background:var(--surface-2)}
.react button[aria-pressed="true"]{color:var(--brand);background:var(--brand-soft)}
.react .n{font-variant-numeric:tabular-nums}
.jobinline{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* listas de chambas y profesionales */
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-of-type{border-top:0}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-size:14px}
.item .t span{display:block;color:var(--muted);font-size:13px}
.money{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.logoco{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--font-display);color:var(--brand);background:var(--brand-soft);flex:none}

/* vistas completas */
.view-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:30px;letter-spacing:-.02em}
.view-head p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pcard .title{color:var(--muted);font-size:13px;min-height:2.8em}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .acts{display:flex;gap:8px;margin-top:6px}
.jcard{display:flex;flex-direction:column;gap:10px}
.jcard .top-row{display:flex;gap:12px}
.jcard .facts{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);padding:30px;text-align:center}

/* perfil */
.profile{padding:0;overflow:hidden}
.profile .cover{height:120px;background:linear-gradient(120deg,var(--brand),color-mix(in oklab,var(--brand) 50%,var(--aji)))}
.profile .body{padding:0 24px 24px;margin-top:-48px;display:flex;flex-direction:column;gap:8px}
.profile .av{border:4px solid var(--surface)}
.profile h1{font-size:28px}
.timeline{display:flex;flex-direction:column;gap:14px}
.tl{display:flex;gap:12px}
.tl .t b{display:block}
.tl .t span{display:block;color:var(--muted);font-size:13px}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.skill i{font-style:normal;color:var(--brand);margin-left:6px;font-variant-numeric:tabular-nums}

/* aviso */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:0 6px 24px rgb(0 0 0 / .18);max-width:calc(100% - 32px)}

/* barra inferior móvil */
.bottom{display:none}

@media (max-width:1040px){
  .grid{grid-template-columns:220px minmax(0,1fr)}
  .rail-right{display:none}
}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .rail-left{display:none}
  .nav{display:none}
  .search{max-width:none}
  .logo .word{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
  .bottom a[aria-current="page"]{color:var(--brand)}
  .bottom svg{width:22px;height:22px}
  .view-head h1{font-size:24px}
  .profile .body{padding:0 16px 16px}
}
@media (prefers-reduced-motion:no-preference){
  .post.new{animation:pop .35s ease-out}
  @keyframes pop{from{transform:translateY(-6px);opacity:.4}to{transform:none;opacity:1}}
}

/* estados de disponibilidad */
:root{--ya:#1C8A4A;--pronto:#E0A100;--no:#D2382B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ya:#4CC27E;--pronto:#F5BF45;--no:#F0645A}}
:root[data-theme="dark"]{--ya:#4CC27E;--pronto:#F5BF45;--no:#F0645A}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;width:fit-content;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ya{color:var(--ya);background:color-mix(in oklab,var(--ya) 14%,transparent)}
.st.pronto{color:var(--aji-ink);background:var(--aji-soft)}
.st.pronto::before{background:var(--pronto)}
.st.no{color:var(--no);background:color-mix(in oklab,var(--no) 12%,transparent)}
.st.no::before{background:var(--no)}

.reg-btn{white-space:nowrap;text-decoration:none;padding:8px 16px;font-size:14px}

/* mapa */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.mapcard{padding:12px;position:relative}
.mapcard svg{display:block;width:100%;height:auto;max-height:78vh;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapcard svg:active{cursor:grabbing}
#mapsvg{position:relative;overflow:hidden;border-radius:8px}
.dep{vector-effect:non-scaling-stroke}
.deplbl{fill:var(--muted);font-family:var(--font-body);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--surface-2);opacity:0;transition:opacity .2s;pointer-events:none}
.zoomed .deplbl{opacity:.75}
.zctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 2px 8px rgb(0 0 0 / .08)}
.zctl button{width:38px;height:38px;border:0;background:var(--surface);font-size:20px;font-weight:700;color:var(--fg);display:grid;place-items:center}
.zctl button+button{border-top:1px solid var(--line)}
.zctl button:hover{background:var(--surface-2)}
.dep{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2;transition:fill .15s}
.dep.on{fill:var(--brand-soft)}
.pin{cursor:pointer}
.pin circle.halo{opacity:.22}
.pin:hover circle.dot,.pin:focus-visible circle.dot{stroke-width:4}
.pin circle.dot{stroke:var(--surface);stroke-width:2.5;vector-effect:non-scaling-stroke}
.pin.sel circle.dot{stroke:var(--fg);stroke-width:3.5}
.pin text{font-family:var(--font-body);font-weight:700;pointer-events:none}
.pin text.cnt{fill:var(--fg);font-weight:800}
.pin .lbl{fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:6px 4px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.sm .kpi b{font-size:18px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px}
.kpi b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.panel-list{max-height:56vh;overflow:auto;margin-right:-8px;padding-right:8px}
.person{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.person:first-child{border-top:0}
.person .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.person .t b{font-size:14px}
.person .t span{color:var(--muted);font-size:13px}
.person.hl{background:var(--brand-soft);border-radius:10px;padding:12px 10px;border-top-color:transparent}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;padding:0;font-size:14px}

/* registro */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field legend{font-weight:700;font-size:14px}
.field small{color:var(--muted);font-size:12px}
.field input,.field select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 12px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
fieldset.field{border:0;padding:0;margin:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;height:100%}
.opt span b{font-size:14px}
.opt span em{font-style:normal;font-size:12px;color:var(--muted)}
.opt input:checked+span{border-color:var(--brand);background:var(--brand-soft)}
.opt input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.err{color:#C2410C;font-size:13px;font-weight:600}
.regside{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-direction:column;gap:10px;font-size:14px}
.steps div{display:flex;gap:10px}
.steps b.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px}

@media (max-width:1040px){.mapgrid{grid-template-columns:minmax(0,1fr)}.panel-list{max-height:none}}
@media (max-width:760px){
  .form{grid-template-columns:1fr}.opts{grid-template-columns:1fr}
  .reg-btn{padding:7px 12px;font-size:13px}
}

/* buscador del mapa */
.mfilter{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.mf-row{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.mf-search{position:relative}
.mf-search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.mf-search input{padding-left:38px}
.mf-row2{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.mf-count{margin-left:auto;font-size:14px;color:var(--muted)}
.mf-count b{color:var(--ya);font-size:16px;font-variant-numeric:tabular-nums}
.mf-chip.ya[aria-pressed="true"]{border-color:var(--ya);color:var(--ya);background:color-mix(in oklab,var(--ya) 14%,transparent)}
.mf-chip.pronto[aria-pressed="true"]{border-color:var(--pronto);color:var(--aji-ink);background:var(--aji-soft)}
@media (max-width:900px){.mf-row{grid-template-columns:1fr 1fr}.mf-q{grid-column:1/-1}.mf-count{margin-left:0;width:100%}}

/* nav badge */
.ic{position:relative;display:block;line-height:0}
.badge{position:absolute;top:-4px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:#D93F2B;color:#fff;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
/* planes */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:880px}
.plan{display:flex;flex-direction:column;gap:12px;padding:24px}
.plan.emp{border:2px solid var(--brand)}
.plan h2{font-size:26px}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:var(--font-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.price span{color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px}
.plan li::before{content:"✓";color:var(--ya);font-weight:800}
.plan .btn{margin-top:auto}
.pay{display:flex;flex-direction:column;gap:16px;padding:24px}
.pay h2{font-size:24px}
.paysum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-2);border-radius:10px;padding:14px 16px;flex-wrap:wrap}
.paysum b{font-family:var(--font-display);font-size:22px}
.paysum small{font-size:13px;color:var(--muted);font-family:var(--font-body);font-weight:500}
.hint{color:var(--muted);font-size:13px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgb(10 20 15 / .5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:16px;padding:24px;width:min(640px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}

const fM={prof:"",area:"",dep:"",prov:"",dist:"",near:true,disp:"",exp:"",col:false,ver:false};

function profMatch(p,pr){if(!pr)return true;const hay=norm(p.title+" "+p.area).replace(/\bing\./g,"ingeniero ingeniera ing ");

const distXY=(pv,ds)=>{const d=(DIST[pv]||[]).find(r=>r[0]===ds);return d?[d[1],d[2]]:[CITIES[pv][1],CITIES[pv][2]]};
const kmBetween=(a,b)=>{const R=6371,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t;return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2))};
const NEAR_KM=10;
function locOK(p){if(!fM.dist){p._km=null;return (!fM.dep||p.dep===fM.dep)&&(!fM.prov||p.city===fM.prov)}
  const c=distXY(fM.prov,fM.dist);p._km=(p.city===fM.prov&&p.dist===fM.dist)?0:kmBetween(c,distXY(p.city,p.dist));
  return p._km===0||(fM.near&&p._km<=NEAR_KM)}
function mapPeople(anyDisp){const q=norm(qv()),pr=norm(fM.prof.trim());return people.filter(p=>(!fM.area||p.area===fM.area)&&locOK(p)&&(anyDisp||!fM.disp||p.disp===fM.disp)&&(!fM.exp||p.years>=+fM.exp)&&(!fM.col||p.col)&&(!fM.ver||p.verif==="ok")&&profMatch(p,pr)&&(!q||norm(p.name+p.title+p.area+p.city+p.dist).includes(q)))}
/* conteos simulados por distrito según filtros */
function curF(){return {area:fM.area,pr:norm(fM.prof.trim()),q:norm(qv()),exp:fM.exp,col:fM.col,ver:fM.ver,disp:fM.disp}}
function tradeOK(o,f){return (!f.area||o[1]===f.area)&&(!f.pr||profMatch({title:o[0],area:o[1]},f.pr))}
function simFrac(f){let w=0;OF.forEach(o=>{if(tradeOK(o,f))w+=o[3]*(f.col?(o[2]?0.8:0):1)});
  return w/OFW*(f.exp==="3"?0.72:f.exp==="5"?0.5:f.exp==="10"?0.2:1)*(f.ver?0.5:1)}
function distOK(d){if(fM.dist){const c=distXY(fM.prov,fM.dist);d.km=(d.pv===fM.prov&&d.ds===fM.dist)?0:kmBetween(c,[d.la,d.lo]);return d.km===0||(fM.near&&d.km<=NEAR_KM)}
  d.km=null;return (!fM.dep||d.dep===fM.dep)&&(!fM.prov||d.pv===fM.prov)}
function personOK(p,f,anyDisp){return (!f.area||p.area===f.area)&&(!f.pr||profMatch(p,f.pr))&&(anyDisp||!f.disp||p.disp===f.disp)&&(!f.exp||p.years>=+f.exp)&&(!f.col||p.col)&&(!f.ver||p.verif==="ok")&&(!f.q||norm(p.name+" "+p.title+" "+p.area+" "+p.city+" "+p.dist).includes(f.q))}
function simCounts(){const f=curF(),fr=simFrac(f),qd=f.q;const out=[];
  DL.forEach(d=>{if(!distOK(d))return;let base=d.n*fr;
    if(qd&&!norm(d.ds+" "+d.pv).includes(qd)&&!OF.some(o=>tradeOK(o,f)&&norm(o[0]+" "+o[1]).includes(qd)))base=0;
    const c={ya:base*d.sya,pronto:base*d.spr,no:base*d.sno};
    people.forEach(p=>{if(p.city===d.pv&&p.dist===d.ds&&personOK(p,f,true))c[p.disp]+=1});
    if(f.disp)["ya","pronto","no"].forEach(k=>{if(k!==f.disp)c[k]=0});
    c.ya=Math.round(c.ya);c.pronto=Math.round(c.pronto);c.no=Math.round(c.no);d.c=c;d.t=c.ya+c.pronto+c.no;if(d.t>0)out.push(d)});
  return out}
function sumC(ds){const k={ya:0,pronto:0,no:0};ds.forEach(d=>{k.ya+=d.c.ya;k.pronto+=d.c.pronto;k.no+=d.c.no});return k}

function sampleIn(ds,k,f){const out=[];
  people.filter(p=>ds.some(d=>d.pv===p.city&&d.ds===p.dist)&&personOK(p,f)).forEach(p=>out.push(p));
  const tot=ds.reduce((a,d)=>a+d.t,0);if(!tot)return out;
  const r=mulberry(hashN(JSON.stringify(f)+ds.length+(ds[0]?ds[0].ds:"")));const ctr=new Map();
  for(let j=0;j<k*80&&out.length<k;j++){let x=r()*tot,d=ds[0];for(const q of ds){x-=q.t;if(x<=0){d=q;break}}

  return out}

    if(lvl==="dep"){const pc={};g.ds.forEach(d=>pc[d.pv]=(pc[d.pv]||0)+d.t);const top=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0][0];[x,y]=proj(CITIES[top][1],CITIES[top][2]);label=g.k}

const pinR=(lvl,n)=>lvl==="dist"?8+Math.log10(n+1)*3.2:10+Math.log10(n+1)*4.6;

document.addEventListener("pointerdown",e=>{const svg=e.target.closest&&e.target.closest("#msvg");if(!svg)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  drag={svg,vb:{...vb},sx:e.clientX,sy:e.clientY,dist:null};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag.dist=Math.hypot(a.x-b.x,a.y-b.y);drag.mid=toSvg(svg,(a.x+b.x)/2,(a.y+b.y)/2)}});
document.addEventListener("pointermove",e=>{if(!drag||!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const rect=drag.svg.getBoundingClientRect(),scale=vb.w/rect.width;
  if(ptrs.size===2&&drag.dist){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(Math.abs(d-drag.dist)>2){zoomAt(d/drag.dist,drag.mid.x,drag.mid.y);drag.dist=d;moved=true}return}
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;
  if(!drag.svg.hasPointerCapture(e.pointerId)){try{drag.svg.setPointerCapture(e.pointerId)}catch(_){}}
  vb.x=drag.vb.x-dx*scale;vb.y=drag.vb.y-dy*scale;applyVb()});

async function sbGuardar(tabla,fila){
  if(!sb)return {error:{message:"Sin conexión con la base de datos. Revisa tu internet e inténtalo otra vez."}};
  const {error}=await sb.from(tabla).insert(fila);
  if(error&&error.code==="23505")return {error:{message:tabla==="empresas"?"Este RUC ya está registrado en Tu Chamba Causa.":"Este DNI ya está registrado en Tu Chamba Causa."}};
  if(error)return {error:{message:"No se pudo guardar: "+error.message}};
  return {}}

  const name=v("r-name"),prof=v("r-prof"),area=v("r-area"),city=v("r-prov"),dist=v("r-dist"),years=parseInt(v("r-years")||"0",10);

  if(miss.length){err.textContent="Falta completar: "+miss.join(", ")+".";err.hidden=false;return}

    <div class="field"><label for="o-inicio">Fecha de inicio</label><input id="o-inicio" type="date" value="${new Date(Date.now()+10*864e5).toISOString().slice(0,10)}"></div>
    <div class="field"><label for="o-dur">Duración</label><select id="o-dur"><option>1 mes</option><option selected>3 meses</option><option>6 meses</option><option>Indefinido</option><option>Por obra</option></select></div>
    <div class="field"><label for="o-reg">Régimen</label><select id="o-reg"><option>Lunes a viernes</option><option>Lunes a sábado</option><option selected>14x7</option><option>21x7</option><option>Remoto</option></select></div>
    <div class="field full"><label for="o-det">Detalle <small>(opcional)</small></label><input id="o-det" placeholder="Ej. Incluye alojamiento y alimentación"></div>
    <div class="field full"><div class="err" id="o-err" hidden></div></div>
    <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Enviar propuesta</button><button class="btn ghost" type="button" data-n="cancel">Cancelar</button></div>
  </form></div>`;
  m.hidden=false;m.dataset.pid=pid;setTimeout(()=>document.getElementById("o-sueldo").focus(),30)}
function closeModal(){const m=document.getElementById("modal");m.hidden=true;m.innerHTML=""}
function sendOffer(e){e.preventDefault();const pid=document.getElementById("modal").dataset.pid,p=P(pid),v=id=>document.getElementById(id).value.trim();
  const sueldo=parseInt(v("o-sueldo"),10),err=document.getElementById("o-err");
  if(!v("o-puesto")||!(sueldo>0)){err.textContent="Completa el puesto y el sueldo que ofreces.";err.hidden=false;return}
  const t={id:Date.now(),with:pid,status:"enviada",unread:0,offer:{puesto:v("o-puesto"),lugar:v("o-lugar"),inicio:v("o-inicio"),duracion:v("o-dur"),regimen:v("o-reg"),sueldo,per:v("o-per"),detalle:v("o-det")},msgs:[]};
  push(t,"sys",`Enviaste una propuesta a ${p.name.split(" ")[0]}: ${soles(sueldo)} ${per(t)}`);
  threads.unshift(t);selThread=t.id;closeModal();location.hash="mensajes";
  if(current()==="mensajes")refreshThread();
  toast("Propuesta enviada");simulateReply(t)}

document.addEventListener("click",e=>{
  if(e.target.id==="modal"){closeModal();return}
  const th=e.target.closest("[data-thread]");if(th){selThread=+th.dataset.thread;refreshThread();return}
  const b=e.target.closest("[data-n]");if(!b)return;const t=T(selThread),a=b.dataset.n;
  if(a==="cancel"){closeModal();return}
  if(a==="back"){selThread=null;refreshThread();return}
  if(!t)return;const n=P(t.with).name.split(" ")[0];
  if(a==="accept"){t.offer.sueldo=t.counter.sueldo;t.counter=null;t.status="acuerdo";push(t,"sys",`Aceptaste ${soles(t.offer.sueldo)}. Acuerdo previo listo.`);refreshThread();return}
  if(a==="counter"){const c=document.getElementById("counterbox");c.hidden=!c.hidden;if(!c.hidden)document.getElementById("n-counter").focus();return}
  if(a==="sendcounter"){const val=parseInt(document.getElementById("n-counter").value,10);if(!(val>0))return;
    t.offer.sueldo=val;t.status="enviada";push(t,"sys",`Nueva oferta: ${soles(val)} ${per(t)}`);refreshThread();simulateReply(t);return}
  if(a==="close"){t.status="rechazada";push(t,"sys","Cerraste la negociación");refreshThread();return}
  if(a==="nohire"){t.hireNo=true;push(t,"sys","Indicaste que no se cerró el trato");refreshThread();return}
  if(a==="hired"){t.hireCo=true;later(()=>{t.hireWk=true;push(t,"sys",`${n} confirmó el trato. Ya puedes destacar su desempeño.`)},1800);t.status="contratado";push(t,"sys",`Confirmaste que contrataste a ${n}. Falta su confirmación.`);refreshThread();return}
  if(a==="schedule"){const f=document.getElementById("n-fecha").value,h=document.getElementById("n-hora").value,m=document.getElementById("n-modo").value;
    if(!f||!h){toast("Elige fecha y hora");return}
    t.interview={fecha:f,hora:h,modo:m};t.status="entrevista";push(t,"sys",`Entrevista agendada: ${fdate(f)}, ${h} · ${m}`);refreshThread();
    later(()=>push(t,"them","Confirmado, ahí estaré. Gracias."),1800);return}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="offerform")sendOffer(e);
  if(e.target.id==="chatform"){e.preventDefault();const i=document.getElementById("n-msg"),txt=i.value.trim(),t=T(selThread);if(!txt||!t)return;
    push(t,"me",txt);i.value="";refreshThread();document.getElementById("n-msg").focus();
    later(()=>push(t,"them","Perfecto, lo reviso y te confirmo."),1800)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeModal()});

/* ---------- enrutador ---------- */
function current(){const h=location.hash.slice(1);if(h.startsWith("p-")&&P(h.slice(2)))return "persona";return ROUTES.includes(h)?h:"inicio"}
function qv(){return document.getElementById("q").value.trim().toLowerCase()}
function renderNav(){const v=current(),u=unreadCount();
  const navHTML=VIEWS.map(([k,l])=>`<a href="#${k}" ${k===v?'aria-current="page"':""}><span class="ic">${ICONS[k]}${k==="mensajes"&&u?`<i class="badge">${u}</i>`:""}</span><span>${l}</span></a>`).join("");
  document.getElementById("nav").innerHTML=navHTML;
  document.getElementById("bottom").innerHTML=VIEWS.filter(([k])=>k!=="muro").map(([k,l])=>`<a href="#${k}" ${k===v?'aria-current="page"':""}><span class="ic">${ICONS[k]}${k==="mensajes"&&u?`<i class="badge">${u}</i>`:""}</span><span>${k==="perfil"?"Perfil":k==="proveedores"?"Proveed.":k==="destacados"?"Top":l}</span></a>`).join("")}
function render(){
  const v=current();
  closeModal();
  document.getElementById("app").innerHTML={inicio:viewInicio,muro:viewMuro,chambas:viewChambas,profesionales:viewProfesionales,perfil:viewPerfil,registro:viewRegistro,planes:viewPlanes,mensajes:viewMensajes,destacados:viewDestacados,persona:viewPersona,aprende:viewAprende,proveedores:viewProveedores}[v]();
  renderNav();
  if(v==="mensajes"){const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight}
  document.getElementById("regtop").hidden=(v==="registro");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
async function cargarRegistrados(){
  if(!sb)return;
  const {data,error}=await sb.from("perfiles_publicos").select("*").order("creado",{ascending:false}).limit(2000);
  if(error||!data)return;
  let n=0;
  data.forEach(r=>{const id="db_"+r.id;if(P(id)||!CITIES[r.provincia])return;
    const p=prep({id,name:r.nombre,title:r.oficio+(r.especialidad?" · "+r.especialidad:""),area:r.area||"",city:r.provincia,dist:r.distrito,
      col:r.colegio||"",disp:r.disponibilidad||(r.disponible?"ya":"no"),years:r.anios_exp||0,verif:r.verificado?"ok":"no",real:true},people.length);
    people.push(p);n++});
  if(!n)return;
  const v=current();
  if(v==="inicio"&&typeof refreshMap==="function")refreshMap();
  else if(v==="profesionales"){const l=document.getElementById("plist");if(l)l.innerHTML=peopleList()}
}

/* ---------- eventos ---------- */
function pickCity(c){selDist=null;selCity=selCity===c?null:c;if(selCity){const [x,y]=proj(CITIES[c][1],CITIES[c][2]);setFocus(x,y,4.6)}refreshMap()}
document.addEventListener("click",e=>{
  const pin=e.target.closest(".pin");if(pin){pickPin(pin);return}
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="clearcity"){selCity=null;selDist=null;vb={...FULL};refreshMap();return}
  if(b.dataset.mdisp!==undefined){fM.disp=b.dataset.mdisp;document.querySelectorAll("[data-mdisp]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.mdisp===fM.disp));refreshMap();return}
  if(b.id==="mfclear"){Object.assign(fM,{prof:"",area:"",dep:"",prov:"",dist:"",near:true,disp:"",exp:"",col:false,ver:false});selCity=null;selDist=null;vb={...FULL};render();return}
  if(b.dataset.showmap){selCity=b.dataset.showmap;selDist=null;{const c=CITIES[selCity];if(c){const [x,y]=proj(c[1],c[2]);setFocus(x,y,4.6)}}fM.area="";fM.disp="";location.hash="inicio";return}
  if(b.dataset.react){const[id,k]=b.dataset.react.split(":");mine[id]=mine[id]===k?undefined:k;
    const p=posts.find(x=>x.id==id);b.closest(".post").outerHTML=postHTML(p);return}
  if(b.dataset.kind){draftKind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.kind===draftKind));return}
  if(b.id==="publish"){const t=document.getElementById("draft");const txt=t.value.trim();
    if(!txt){t.focus();toast("Escribe algo antes de publicar");return}
    const p={id:Date.now(),by:ME,ago:"ahora",kind:draftKind,text:txt,r:{chevere:0,apoyo:0,felicitaciones:0},isNew:true};
    posts.unshift(p);document.getElementById("feed").insertAdjacentHTML("afterbegin",postHTML(p));p.isNew=false;t.value="";toast("Publicado en tu muro");return}
  if(b.dataset.apply){toast(`Postulaste a ${b.dataset.apply} (ejemplo)`);return}
  if(b.dataset.save){const id=+b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);b.textContent=saved.has(id)?"Guardada":"Guardar";toast(saved.has(id)?"Chamba guardada":"Quitada de guardadas");return}
  if(b.dataset.connect){b.textContent="Solicitud enviada";b.disabled=true;return}
  if(b.dataset.contact){openOffer(b.dataset.contact);return}
  if(b.dataset.comment){toast("Comentarios: pendiente de construir");return}
  if(b.id==="editp"){toast("Esta función se arma en la siguiente versión");return}
});
document.addEventListener("keydown",e=>{
  const pin=e.target.closest&&e.target.closest(".pin");
  if(pin&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const k=pin.dataset.key;pickPin(pin);const n=[...document.querySelectorAll(".pin")].find(q=>q.dataset.key===k);n&&n.focus()}
});
document.addEventListener("submit",e=>{if(e.target.id==="regform")submitReg(e)});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(e.target.name==="r-disp"){document.getElementById("r-desde-wrap").hidden=e.target.value!=="pronto";return}
  if(id.startsWith("fj-")){fJ[id.slice(3)]=e.target.value;document.getElementById("jlist").innerHTML=jobList()}
  if(id.startsWith("fp-")){fP[id.slice(3)]=e.target.value;document.getElementById("plist").innerHTML=peopleList()}
  if(id==="fm-col"){fM.col=e.target.checked;refreshMap();return}
  if(id==="fm-ver"){fM.ver=e.target.checked;refreshMap();return}
  if(id==="fm-near"){fM.near=e.target.checked;refreshMap();return}
  if(id==="fm-dep"||id==="fm-prov"||id==="fm-dist"){const k=id.slice(3);fM[k]=e.target.value;
    if(k==="dep"){fM.prov="";fM.dist=""}if(k==="prov")fM.dist="";
    selCity=fM.prov||null;selDist=fM.dist||null;
    if(fM.dist){const [la,lo]=distXY(fM.prov,fM.dist);const [x,y]=proj(la,lo);setFocus(x,y,9)}
    else if(fM.prov){const [x,y]=proj(CITIES[fM.prov][1],CITIES[fM.prov][2]);setFocus(x,y,4.6)}
    else if(fM.dep){const ks=Object.keys(CITIES).filter(q=>CITIES[q][0]===fM.dep);const xs=ks.map(q=>proj(CITIES[q][1],CITIES[q][2]));setFocus(xs.reduce((a,b)=>a+b[0],0)/xs.length,xs.reduce((a,b)=>a+b[1],0)/xs.length,2.4)}
    else vb={...FULL};
    const m=document.querySelector(".mfilter");if(m)m.outerHTML=mapFilters();refreshMap();return}
  if(id.startsWith("fm-")&&id!=="fm-prof"){fM[id.slice(3)]=e.target.value;refreshMap()}
});
document.addEventListener("input",e=>{if(e.target.id==="fm-prof"){fM.prof=e.target.value;refreshMap()}});
document.getElementById("q").addEventListener("input",()=>{
  const v=current();
  if(v==="chambas")document.getElementById("jlist").innerHTML=jobList();
  else if(v==="profesionales")document.getElementById("plist").innerHTML=peopleList();
  else if(v==="inicio")refreshMap();
});
document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!["chambas","profesionales","inicio"].includes(current())){location.hash="inicio"}
});
render();
cargarRegistrados();
</script>
